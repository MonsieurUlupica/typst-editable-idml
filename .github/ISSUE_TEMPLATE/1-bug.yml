# Modified for Jean Porcel’s SVG fork (2026).
name: SVG export bug
description: Report a reproducible problem with hybrid SVG output.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Public reproduction
      description: Include a small Typst source and original public SVG assets, the command and the expected versus observed output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fork commit, operating system, SVG editor version and installed fonts.
    validations:
      required: true
